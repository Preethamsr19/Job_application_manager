{% extends "base.html" %}{% block title %}Create account | CareerTrack{% endblock %}{% block content %}
<div class="auth-card"><a class="brand auth-brand" href="/"><span class="brand-mark">J</span><span>CareerTrack<small>JOB APPLICATIONS</small></span></a><span class="eyebrow">GET ORGANIZED</span><h1>Create your account</h1><p class="auth-subtitle">Build a single place for every opportunity and next step.</p>
<form id="register-form" class="auth-form"><label>Full name<input name="name" required autocomplete="name" placeholder="Your name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>University / college<input name="university" placeholder="Optional"></label><label>Graduation year<input name="graduation_year" type="number" min="2000" max="2100" placeholder="e.g. 2027"></label><button class="btn btn-primary btn-wide">Create account</button><div id="auth-error" class="form-error"></div></form><p class="auth-switch">Already registered? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p></div>{% endblock %}
